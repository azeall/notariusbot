{% extends "base_panel.html" %}
{% block content %}
<div class="login">
  <h1>{{ tenant.display_name }}</h1>
  <p class="lead">Вход для сотрудников</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/staff/{{ tenant.slug }}/login">
    <label class="field">
      <span class="cap">Рабочая почта</span>
      <input type="email" name="email" required autocomplete="username">
    </label>
    <label class="field">
      <span class="cap">Пароль</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label class="field remember">
      <input type="checkbox" name="remember" value="1">
      <span>Запомнить меня на этом устройстве</span>
    </label>
    <p class="hint">
      На общем компьютере конторы галочку лучше не ставить: вход тогда
      действует до конца дня.
    </p>
    <button type="submit" style="width:100%">Войти</button>
  </form>
</div>
{% endblock %}
