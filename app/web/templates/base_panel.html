<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }} — {{ tenant.display_name if tenant else 'Нотариус' }}</title>
  <!-- Две стороны продукта выглядят по-разному намеренно: кабинет владельца
       сервиса — в стиле его сайта, панель нотариуса — в его палитре. -->
  <link rel="stylesheet" href="{{ stylesheet | default('/static/notary.css') }}">
</head>
<body>
{% if staff %}
<div class="topbar">
  <div class="brand">{{ tenant.display_name }}</div>
  <nav>
    <a href="/staff">Заявки</a>
    {% if staff.can_manage_catalog %}
      <a href="/admin">Услуги</a>
      <a href="/admin/schedule">Расписание</a>
      <a href="/admin/staff">Сотрудники</a>
      <a href="/admin/audit">Журнал</a>
    {% endif %}
  </nav>
  <a href="/staff/password" class="who" style="text-decoration:none">{{ staff.full_name }}</a>
  <form method="post" action="/staff/logout" style="margin:0">
    <button class="ghost" type="submit">Выйти</button>
  </form>
</div>
{% endif %}
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
