<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }} — {{ tenant.display_name if tenant else 'Нотариус' }}</title>
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body>
{% if staff %}
<div class="topbar">
  <div class="brand">{{ tenant.display_name }}</div>
  <nav>
    <a href="/staff">Заявки</a>
    {% if staff.can_manage_catalog %}
      <a href="/admin">Услуги</a>
      <a href="/admin/schedule">Расписание</a>
      <a href="/admin/staff">Сотрудники</a>
      <a href="/admin/audit">Журнал</a>
    {% endif %}
  </nav>
  <span class="who">{{ staff.full_name }}</span>
  <form method="post" action="/staff/logout" style="margin:0">
    <button class="ghost" type="submit">Выйти</button>
  </form>
</div>
{% endif %}
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
