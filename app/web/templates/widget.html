<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/widget.css">
  <!-- Палитра нотариуса: перекрывает значения по умолчанию, чтобы виджет
       выглядел частью его сайта, а не чужой вставкой. -->
  <style>{{ palette_css }}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="name">{{ tenant.display_name }}</div>
    <div class="sub">
      {%- if tenant.city %}{{ tenant.city }}{% endif %}
      {%- if tenant.phone %} · {{ tenant.phone }}{% endif %}
    </div>
  </header>

  <div class="chat scroll" id="chat"></div>

  <div class="composer">
    <div class="err" id="err"></div>
    <div class="choices scroll" id="choices"></div>
    <div class="row" id="input-row" hidden>
      <input type="text" id="field" autocomplete="off">
      <button class="send" type="button" id="send" aria-label="Отправить">→</button>
    </div>
    <div class="honeypot" aria-hidden="true">
      <label>Сайт<input type="text" id="website" tabindex="-1" autocomplete="off"></label>
    </div>
    <div class="legal">
      Предварительная информация. Окончательный перечень документов
      подтверждает сотрудник нотариуса.
    </div>
  </div>
</div>

<script>
(function () {
  var API = {{ api_base | tojson }};

  var chat = document.getElementById('chat');
  var choices = document.getElementById('choices');
  var row = document.getElementById('input-row');
  var field = document.getElementById('field');
  var send = document.getElementById('send');
  var err = document.getElementById('err');

  var state = { service: null, slot: null, name: '', phone: '' };
  var onText = null;

  // --- реплики ---------------------------------------------------------

  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function bubble(cls, build) {
    var el = document.createElement('div');
    el.className = 'msg ' + cls;
    build(el);
    chat.appendChild(el);
    scroll();
    return el;
  }

  function say(text) {
    return bubble('bot', function (el) { el.textContent = text; });
  }

  function you(text) {
    return bubble('me', function (el) { el.textContent = text; });
  }

  function note(text) {
    return bubble('note', function (el) { el.textContent = text; });
  }

  function typing() {
    var el = document.createElement('div');
    el.className = 'msg bot typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(el);
    scroll();
    return el;
  }

  // Небольшая пауза перед ответом: без неё реплики появляются рывком
  // и читаются хуже, чем настоящая переписка.
  function reply(text, next) {
    var dots = typing();
    setTimeout(function () {
      dots.remove();
      if (text) say(text);
      if (next) next();
    }, 340);
  }

  // --- варианты ответа и ввод -----------------------------------------

  function clearChoices() { choices.innerHTML = ''; }

  function choice(label, hint, onPick, cls) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (cls ? ' ' + cls : '');
    var t = document.createElement('div');
    t.textContent = label;
    b.appendChild(t);
    if (hint) {
      var m = document.createElement('div');
      m.className = 'm';
      m.textContent = hint;
      b.appendChild(m);
    }
    b.addEventListener('click', function () {
      clearChoices();
      onPick();
    });
    choices.appendChild(b);
    return b;
  }

  function ask(placeholder, handler) {
    onText = handler;
    field.value = '';
    field.placeholder = placeholder;
    row.hidden = false;
    field.focus();
  }

  function hideInput() { row.hidden = true; onText = null; }

  send.addEventListener('click', submitText);
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitText();
  });

  function submitText() {
    var value = field.value.trim();
    if (!value || !onText) return;
    var handler = onText;
    field.value = '';
    handler(value);
  }

  // --- шаги ------------------------------------------------------------

  function start() {
    reply('Здравствуйте. Подскажу, какие документы нужны, и приму заявку.', function () {
      reply('Напишите своими словами, что нужно — например «доверенность на машину». Или выберите из списка.', function () {
        loadAll();
        ask('Что нужно оформить?', function (text) {
          you(text);
          hideInput();
          search(text);
        });
      });
    });
  }

  function serviceHint(svc) {
    var mode = svc.submission_mode === 'visit' ? 'нужен личный визит' : 'документы можно прислать онлайн';
    return mode + (svc.lead_time_note ? ' · ' + svc.lead_time_note : '');
  }

  function listServices(items) {
    clearChoices();
    items.forEach(function (svc) {
      choice(svc.title, serviceHint(svc), function () { pick(svc); });
    });
  }

  function loadAll() {
    fetch(API + '/services')
      .then(function (r) { return r.json(); })
      .then(function (items) { listServices(items.slice(0, 12)); })
      .catch(function () { err.textContent = 'Не удалось загрузить список услуг.'; });
  }

  function search(text) {
    fetch(API + '/services/search?q=' + encodeURIComponent(text))
      .then(function (r) { return r.json(); })
      .then(function (items) {
        if (!items.length) {
          reply('Не нашёл подходящей услуги по этим словам. Посмотрите полный список или напишите иначе.', function () {
            loadAll();
            ask('Попробуйте другими словами', function (again) {
              you(again); hideInput(); search(again);
            });
          });
          return;
        }
        reply(items.length === 1 ? 'Похоже, вам нужно это:' : 'Вот что подходит:', function () {
          listServices(items);
        });
      })
      .catch(function () { err.textContent = 'Нет связи с сервером.'; });
  }

  function pick(svc) {
    state.service = svc;
    state.slot = null;
    you(svc.title);
    hideInput();

    reply(null, function () {
      bubble('bot', function (el) {
        var facts = [];
        if (svc.lead_time_note) facts.push('срок: ' + svc.lead_time_note);
        if (svc.price_note) facts.push(svc.price_note);
        facts.push(svc.submission_mode === 'visit' ? 'нужен личный визит' : 'документы онлайн');

        var title = document.createElement('div');
        title.className = 'title';
        title.textContent = svc.documents.length ? 'Что понадобится' : 'Документы не требуются';
        el.appendChild(title);

        var f = document.createElement('div');
        f.className = 'facts';
        f.textContent = facts.join(' · ');
        el.appendChild(f);

        if (svc.documents.length) {
          var ul = document.createElement('ul');
          ul.className = 'docs';
          svc.documents.forEach(function (doc) {
            var li = document.createElement('li');
            if (!doc.is_required) li.className = 'optional';
            var line = document.createElement('div');
            line.textContent = doc.title;
            if (!doc.is_required) {
              var opt = document.createElement('span');
              opt.className = 'opt';
              opt.textContent = 'если есть';
              line.appendChild(opt);
            }
            li.appendChild(line);
            if (doc.description) {
              var d = document.createElement('div');
              d.className = 'd';
              d.textContent = doc.description;
              li.appendChild(d);
            }
            ul.appendChild(li);
          });
          el.appendChild(ul);
        }
      });

      choice('Оформить заявку', null, askName, 'primary');
      choice('Выбрать другую услугу', null, function () {
        reply('Хорошо. Вот все услуги:', loadAll);
      }, 'quiet');
    });
  }

  function askName() {
    reply('Как вас зовут? Напишите фамилию и имя.', function () {
      ask('Фамилия и имя', function (value) {
        if (value.length < 2) { err.textContent = 'Слишком коротко.'; return; }
        err.textContent = '';
        state.name = value;
        you(value);
        askPhone();
      });
    });
  }

  function askPhone() {
    reply('Оставьте номер телефона для связи.', function () {
      ask('+7 900 000-00-00', function (value) {
        var digits = value.replace(/\D/g, '');
        if (digits.length < 10) { err.textContent = 'Номер выглядит неполным.'; return; }
        err.textContent = '';
        state.phone = value;
        you(value);
        hideInput();
        askConsent();
      });
    });
  }

  function askConsent() {
    reply('Для оформления нужно согласие на обработку персональных данных. Они используются только для подготовки нотариального действия.', function () {
      choice('Согласен', null, function () {
        you('Согласен');
        afterConsent();
      }, 'primary');
      choice('Отказаться', null, function () {
        you('Отказаться');
        reply('Хорошо. Без согласия заявку принять нельзя, но вы всегда можете позвонить нотариусу напрямую.');
      }, 'quiet');
    });
  }

  function afterConsent() {
    if (state.service.submission_mode !== 'visit') { submit(); return; }

    reply('Выберите удобное время приёма.', function () {
      fetch(API + '/services/' + state.service.id + '/slots')
        .then(function (r) { return r.json(); })
        .then(function (slots) {
          if (!slots.length) {
            reply('Свободного времени на ближайшие две недели нет. Оставлю заявку — сотрудник свяжется и подберёт время.', submit);
            return;
          }
          slots.forEach(function (slot) {
            choice(slot.label, null, function () {
              state.slot = slot.starts_at;
              you(slot.label);
              submit();
            }, 'slot');
          });
        })
        .catch(function () { err.textContent = 'Не удалось загрузить свободное время.'; });
    });
  }

  function submit() {
    hideInput();
    clearChoices();
    var dots = typing();

    fetch(API + '/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: state.service.id,
        full_name: state.name,
        phone: state.phone,
        comment: '',
        consent: true,
        website: document.getElementById('website').value,
        slot: state.slot
      })
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        dots.remove();
        if (!res.ok) {
          var detail = res.body.detail;
          if (Array.isArray(detail)) detail = detail.map(function (d) { return d.msg; }).join('. ');
          say(detail || 'Не удалось отправить заявку.');
          choice('Попробовать снова', null, submit, 'primary');
          return;
        }
        done(res.body);
      })
      .catch(function () {
        dots.remove();
        say('Нет связи с сервером.');
        choice('Попробовать снова', null, submit, 'primary');
      });
  }

  function done(data) {
    say('Заявка № ' + data.public_number + ' принята.');

    if (data.appointment_at) {
      reply('Ждём вас в выбранное время. Сотрудник свяжется для подтверждения.');
    } else if (data.upload_url) {
      reply(null, function () {
        bubble('bot', function (el) {
          var p = document.createElement('div');
          p.textContent = 'Документы можно прислать прямо сейчас:';
          el.appendChild(p);
          var a = document.createElement('a');
          a.href = data.upload_url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'Загрузить документы';
          el.appendChild(a);
          var n = document.createElement('div');
          n.className = 'facts';
          n.style.marginTop = '6px';
          n.textContent = 'Ссылка действует 30 минут, догрузить забытое можно по ней же.';
          el.appendChild(n);
        });
        note('Отправлять сканы в мессенджер не нужно — так они не осядут на чужих серверах.');
        offerMore();
      });
      return;
    } else {
      reply('Сотрудник свяжется с вами для подтверждения.');
    }
    offerMore();
  }

  function offerMore() {
    setTimeout(function () {
      choice('Оформить ещё одну заявку', null, function () {
        chat.innerHTML = '';
        state = { service: null, slot: null, name: '', phone: '' };
        start();
      }, 'quiet');
    }, 500);
  }

  start();
})();
</script>
</body>
</html>
