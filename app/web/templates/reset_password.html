{% extends "base_panel.html" %}
{% block content %}
<div class="login">
  <h1>Новый пароль</h1>
  <p class="lead">
    {{ who }}{% if tenant %} · {{ tenant.display_name }}{% endif %}
  </p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/staff/reset/{{ token }}">
    <label class="field">
      <span class="cap">Новый пароль</span>
      <input type="password" name="new_password" required minlength="8" autofocus>
    </label>
    <label class="field">
      <span class="cap">Ещё раз</span>
      <input type="password" name="repeat_password" required minlength="8">
    </label>
    <div class="actions">
      <button type="submit">Сохранить и войти</button>
    </div>
  </form>

  <p class="lead" style="margin-top:18px">
    Ссылка одноразовая: после смены пароля она перестаёт работать.
  </p>
</div>
{% endblock %}
