{% extends "base_panel.html" %}
{% block content %}
<div class="login">
  <h1>Смена пароля</h1>
  <p class="lead">{{ who }}</p>

  {% if done %}
    <div class="callout">
      Пароль изменён. Новый действует сразу — старый больше не подойдёт.
    </div>
    <div class="actions">
      <a class="btn ghost" href="{{ back }}">Вернуться</a>
    </div>
  {% else %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="{{ action }}">
      <label class="field">
        <span class="cap">Текущий пароль</span>
        <input type="password" name="current_password" required
               autocomplete="current-password">
      </label>
      <label class="field">
        <span class="cap">Новый пароль</span>
        <input type="password" name="new_password" required minlength="8"
               autocomplete="new-password">
        <span class="note">От 8 символов. Длинная фраза надёжнее короткого набора знаков.</span>
      </label>
      <label class="field">
        <span class="cap">Ещё раз</span>
        <input type="password" name="repeat_password" required minlength="8"
               autocomplete="new-password">
      </label>

      <div class="actions">
        <button type="submit">Сменить пароль</button>
        <a class="btn ghost" href="{{ back }}">Отмена</a>
      </div>
    </form>
  {% endif %}
</div>
{% endblock %}
