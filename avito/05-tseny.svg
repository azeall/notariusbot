<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1200" height="900" fill="#ffffff"/><text x="80" y="150" font-size="64" font-weight="700" fill="#0b0b0d" letter-spacing="-2">Сколько стоит</text><line x1="80" y1="256" x2="1120" y2="256" stroke="#e6e7ea" stroke-width="2"/><text x="80" y="330" font-size="40" font-weight="600" fill="#0b0b0d">Сайт вместе с заявками</text><text x="1120" y="324" font-size="52" font-weight="700" fill="#0b0b0d" text-anchor="end" letter-spacing="-1">60 000 ₽</text><text x="1120" y="368" font-size="30" font-weight="500" fill="#9aa0a8" text-anchor="end">+ 2 500 ₽ в месяц</text><line x1="80" y1="426" x2="1120" y2="426" stroke="#e6e7ea" stroke-width="2"/><text x="80" y="500" font-size="40" font-weight="600" fill="#0b0b0d">Заявки на готовый сайт</text><text x="1120" y="494" font-size="52" font-weight="700" fill="#0b0b0d" text-anchor="end" letter-spacing="-1">15 000 ₽</text><text x="1120" y="538" font-size="30" font-weight="500" fill="#9aa0a8" text-anchor="end">+ 2 500 ₽ в месяц</text><line x1="80" y1="596" x2="1120" y2="596" stroke="#e6e7ea" stroke-width="2"/><text x="80" y="670" font-size="40" font-weight="600" fill="#0b0b0d">Только сайт</text><text x="1120" y="664" font-size="52" font-weight="700" fill="#0b0b0d" text-anchor="end" letter-spacing="-1">55 000 ₽</text><text x="1120" y="708" font-size="30" font-weight="500" fill="#9aa0a8" text-anchor="end">без ежемесячных платежей</text><line x1="80" y1="596" x2="1120" y2="596" stroke="#e6e7ea" stroke-width="2"/><text x="80" y="770" font-size="28" font-weight="500" fill="#9aa0a8">Домен и хостинг — напрямую, около 1 500 ₽ в год</text><text x="80" y="850" font-size="26" font-weight="600" fill="#9aa0a8" letter-spacing="-0.5">нотариус<tspan fill="#2f5bea">·</tspan>бот</text></svg>