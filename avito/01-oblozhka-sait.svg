<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1200" height="900" fill="#0b0b0d"/><rect x="0" y="0" width="1200" height="10" fill="#2f5bea"/><text x="80" y="330" font-size="100" font-weight="700" fill="#ffffff" letter-spacing="-3">Сайт нотариуса</text><text x="80" y="446" font-size="100" font-weight="700" fill="#2f5bea" letter-spacing="-3">+ приём заявок</text><text x="80" y="566" font-size="44" font-weight="500" fill="#c9cdd4">Клиент пишет, что ему нужно, —</text><text x="80" y="626" font-size="44" font-weight="500" fill="#c9cdd4">получает список документов и запись</text><rect x="80" y="700" width="440" height="78" rx="39" fill="#2f5bea"/><text x="300" y="751" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">Под ключ за 2–5 дней</text><text x="80" y="848" font-size="26" font-weight="600" fill="#6b7280" letter-spacing="-0.5">нотариус<tspan fill="#2f5bea">·</tspan>бот</text></svg>