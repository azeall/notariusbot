<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1200" height="900" fill="#0b0b0d"/><text x="80" y="150" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-2">Меняете сами,</text><text x="80" y="228" font-size="60" font-weight="700" fill="#2f5bea" letter-spacing="-2">без разработчика</text><circle cx="89" cy="349" r="9" fill="#ffffff"/><text x="122" y="360" font-size="42" font-weight="500" fill="#e6e8ec">Услуги, цены и сроки</text><circle cx="89" cy="445" r="9" fill="#ffffff"/><text x="122" y="456" font-size="42" font-weight="500" fill="#e6e8ec">Списки документов</text><circle cx="89" cy="541" r="9" fill="#ffffff"/><text x="122" y="552" font-size="42" font-weight="500" fill="#e6e8ec">Часы приёма и выходные</text><circle cx="89" cy="637" r="9" fill="#ffffff"/><text x="122" y="648" font-size="42" font-weight="500" fill="#e6e8ec">Сотрудники и их доступы</text><circle cx="89" cy="733" r="9" fill="#ffffff"/><text x="122" y="744" font-size="42" font-weight="500" fill="#e6e8ec">Вид виджета под ваш сайт</text><text x="80" y="810" font-size="26" font-weight="600" fill="#6b7280" letter-spacing="-0.5">нотариус<tspan fill="#2f5bea">·</tspan>бот</text></svg>