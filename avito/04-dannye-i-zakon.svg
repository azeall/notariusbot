<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1200" height="900" fill="#ffffff"/><text x="80" y="150" font-size="60" font-weight="700" fill="#0b0b0d" letter-spacing="-2">Паспорта клиентов —</text><text x="80" y="228" font-size="60" font-weight="700" fill="#2f5bea" letter-spacing="-2">под 152-ФЗ</text><circle cx="89" cy="349" r="9" fill="#2f5bea"/><text x="122" y="360" font-size="42" font-weight="500" fill="#0b0b0d">Согласие — до создания заявки</text><circle cx="89" cy="445" r="9" fill="#2f5bea"/><text x="122" y="456" font-size="42" font-weight="500" fill="#0b0b0d">Файлы хранятся зашифрованными</text><circle cx="89" cy="541" r="9" fill="#2f5bea"/><text x="122" y="552" font-size="42" font-weight="500" fill="#0b0b0d">Ссылка одноразовая, живёт 30 минут</text><circle cx="89" cy="637" r="9" fill="#2f5bea"/><text x="122" y="648" font-size="42" font-weight="500" fill="#0b0b0d">Каждое открытие пишется в журнал</text><circle cx="89" cy="733" r="9" fill="#2f5bea"/><text x="122" y="744" font-size="42" font-weight="500" fill="#0b0b0d">Сервер в России</text><text x="80" y="810" font-size="26" font-weight="600" fill="#9aa0a8" letter-spacing="-0.5">нотариус<tspan fill="#2f5bea">·</tspan>бот</text></svg>