name: Service and showcase checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: notarybot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/notarybot_test
      DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/notarybot_test
      PUBLIC_BASE_URL: http://test
      SESSION_SECRET: ci-only-session-key-never-deploy-this
      DOCUMENT_ENCRYPTION_KEY: ci-only-encryption-key-never-deploy-this
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install -r requirements.txt
      - run: ruff check --select E9,F63,F7,F82 app tests
      - run: pytest -q
      - name: Validate showcase scripts
        run: for file in vendor-site/*.js; do node --check "$file"; done
